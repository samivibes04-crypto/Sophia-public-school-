<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sophia School - Management Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center bg-slate-900 p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 border border-slate-200">
            <div class="text-center mb-6">
                <div class="w-20 h-20 bg-blue-900 text-white rounded-full flex items-center justify-center mx-auto text-2xl font-bold mb-3 shadow-lg">
                    SPS
                </div>
                <h1 class="text-2xl font-bold text-slate-800">SOPHIA SCHOOL</h1>
                <p class="text-xs text-slate-500">Tonk, Rajasthan | Cloud Management System</p>
            </div>

            <!-- Role Selector -->
            <div class="flex rounded-lg bg-slate-100 p-1 mb-6">
                <button type="button" id="btn-role-principal" onclick="selectRole('principal')" class="flex-1 py-2 text-xs font-semibold rounded-md bg-white text-blue-900 shadow">Principal</button>
                <button type="button" id="btn-role-teacher" onclick="selectRole('teacher')" class="flex-1 py-2 text-xs font-semibold rounded-md text-slate-600">Teacher</button>
                <button type="button" id="btn-role-guardian" onclick="selectRole('guardian')" class="flex-1 py-2 text-xs font-semibold rounded-md text-slate-600">Guardian</button>
            </div>

            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1" id="lbl-username">Username</label>
                    <input type="text" id="login-username" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="Enter ID/Username">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Password</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-blue-900 text-white py-2.5 rounded-lg font-semibold hover:bg-blue-800 transition shadow">Login Now</button>
            </form>

            <div class="mt-6 pt-4 border-t text-center">
                <p class="text-xs text-slate-400 mb-2">Instant Quick Login Buttons:</p>
                <div class="flex justify-center gap-2 text-xs">
                    <button type="button" onclick="autoLogin('principal','principal','admin123')" class="px-3 py-1.5 bg-blue-50 text-blue-900 font-bold border border-blue-200 rounded-lg">1-Click Principal</button>
                    <button type="button" onclick="autoLogin('teacher','T101','teacher123')" class="px-3 py-1.5 bg-emerald-50 text-emerald-900 font-bold border border-emerald-200 rounded-lg">1-Click Teacher</button>
                    <button type="button" onclick="autoLogin('guardian','STU101','parent123')" class="px-3 py-1.5 bg-amber-50 text-amber-900 font-bold border border-amber-200 rounded-lg">1-Click Parent</button>
                </div>
            </div>
        </div>
    </div>

    <!-- DASHBOARD MAIN APP -->
    <div id="main-dashboard" class="hidden min-h-screen flex flex-col md:flex-row">
        <!-- Sidebar Navigation -->
        <aside class="w-full md:w-64 bg-slate-900 text-white flex-shrink-0 p-4">
            <div class="flex items-center gap-3 pb-4 mb-4 border-b border-slate-800">
                <div class="w-10 h-10 bg-blue-800 rounded-full flex items-center justify-center font-bold text-sm">SPS</div>
                <div>
                    <h2 class="font-bold text-sm">SOPHIA SCHOOL</h2>
                    <span id="role-badge" class="text-[10px] bg-blue-700 px-2 py-0.5 rounded text-blue-100 font-bold">PRINCIPAL</span>
                </div>
            </div>
            <nav id="nav-links" class="space-y-1"></nav>
            <div class="pt-6 mt-6 border-t border-slate-800">
                <button type="button" onclick="logoutApp()" class="w-full py-2 bg-red-600/20 text-red-400 rounded-lg text-xs font-bold hover:bg-red-600 hover:text-white transition">Logout System</button>
            </div>
        </aside>

        <!-- Dynamic Content View -->
        <main class="flex-1 p-6 overflow-y-auto">
            <div id="app-view"></div>
        </main>
    </div>

    <!-- JAVASCRIPT CONTROLLER -->
    <script>
        // Firebase Cloud Data Initialization
        const firebaseConfig = {
            databaseURL: "https://sophia-school-tonk-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        
        let dbRef = null;
        try {
            firebase.initializeApp(firebaseConfig);
            dbRef = firebase.database().ref("sophia_app_data_v2");
        } catch(e) { console.log("Local Storage Mode Active"); }

        let activeRole = 'principal';
        
        const initialData = {
            students: [
                { id: 'STU101', name: 'Aarav Sharma', parentName: 'Ramesh Sharma', class: 'X-A', parentMobile: '9829012345', totalFee: 24000, paidFee: 18000, prevDue: 2500, attendance: 92, result: 'A Grade (88%)', homework: 'Maths Chapter 5 Ex 5.2' },
                { id: 'STU102', name: 'Priya Verma', parentName: 'Suresh Verma', class: 'X-A', parentMobile: '9829054321', totalFee: 24000, paidFee: 24000, prevDue: 0, attendance: 96, result: 'A+ Grade (94%)', homework: 'Science Diagram Practice' }
            ],
            notices: [
                { id: 1, title: 'Half-Yearly Examination Schedule', content: 'Exams start from Oct 20. Timetable uploaded.', date: '2026-10-10' }
            ],
            messages: [
                { sender: 'Teacher', text: 'Aarav ne aaj test me top kiya hai!' }
            ]
        };

        function getDBData() {
            const local = localStorage.getItem('sophia_school_db');
            return local ? JSON.parse(local) : initialData;
        }

        function saveDBData(data) {
            localStorage.setItem('sophia_school_db', JSON.stringify(data));
            if(dbRef) dbRef.set(data);
        }

        // Live Cloud Sync Listener
        if(dbRef) {
            dbRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if(data) {
                    localStorage.setItem('sophia_school_db', JSON.stringify(data));
                } else {
                    dbRef.set(initialData);
                }
            });
        }

        function selectRole(role) {
            activeRole = role;
            ['principal', 'teacher', 'guardian'].forEach(r => {
                const btn = document.getElementById(`btn-role-${r}`);
                if(r === role) {
                    btn.className = "flex-1 py-2 text-xs font-semibold rounded-md bg-white text-blue-900 shadow";
                } else {
                    btn.className = "flex-1 py-2 text-xs font-semibold rounded-md text-slate-600";
                }
            });
            document.getElementById('lbl-username').innerText = role === 'guardian' ? "Scholar ID / Mobile No" : "Username";
        }

        function autoLogin(role, u, p) {
            selectRole(role);
            document.getElementById('login-username').value = u;
            document.getElementById('login-password').value = p;
            startLogin();
        }

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            startLogin();
        });

        function startLogin() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-dashboard').classList.remove('hidden');
            document.getElementById('role-badge').innerText = activeRole.toUpperCase();
            buildSidebarNav();
            loadModule(activeRole === 'principal' ? 'fees' : (activeRole === 'guardian' ? 'guardian' : 'teacher'));
        }

        function logoutApp() {
            document.getElementById('main-dashboard').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        function buildSidebarNav() {
            const nav = document.getElementById('nav-links');
            nav.innerHTML = '';
            let menu = activeRole === 'principal' ? [
                { id: 'fees', label: 'Fee Collection & Records' },
                { id: 'students', label: 'Classwise Students' },
                { id: 'notices', label: 'Publish Notice' }
            ] : (activeRole === 'teacher' ? [
                { id: 'teacher', label: 'Attendance & Homework' },
                { id: 'chat', label: 'Parent Chat' }
            ] : [
                { id: 'guardian', label: 'Child Dashboard' },
                { id: 'chat', label: 'Teacher Chat' }
            ]);

            menu.forEach(m => {
                const b = document.createElement('button');
                b.className = "w-full text-left px-3 py-2 text-xs font-semibold rounded-lg text-slate-300 hover:bg-slate-800 transition";
                b.innerText = m.label;
                b.onclick = function() { loadModule(m.id); };
                nav.appendChild(b);
            });
        }

        function loadModule(mod) {
            const db = getDBData();
            const view = document.getElementById('app-view');

            if(mod === 'fees') {
                view.innerHTML = `
                    <h2 class="text-2xl font-bold mb-4">Fee Collection & Receipts</h2>
                    <div class="bg-white rounded-xl border p-4">
                        <table class="w-full text-left text-sm">
                            <thead class="border-b text-xs text-slate-400">
                                <tr><th class="py-2">Student</th><th class="py-2">Class</th><th class="py-2">Total</th><th class="py-2">Paid</th><th class="py-2">Prev. Due</th><th class="py-2">Action</th></tr>
                            </thead>
                            <tbody>
                                ${db.students.map(s => `
                                    <tr class="border-b">
                                        <td class="py-3 font-semibold">${s.name}<br><span class="text-xs text-slate-400">ID: ${s.id}</span></td>
                                        <td>${s.class}</td>
                                        <td>₹${s.totalFee}</td>
                                        <td class="text-emerald-600 font-bold">₹${s.paidFee}</td>
                                        <td class="text-red-600 font-bold">₹${s.prevDue || 0}</td>
                                        <td><button onclick="collectFee('${s.id}')" class="px-3 py-1 bg-blue-900 text-white rounded text-xs">+ Collect</button></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>`;
            } else if(mod === 'students') {
                view.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-2xl font-bold">Classwise Students</h2>
                        <button onclick="addNewStudent()" class="px-3 py-1.5 bg-blue-900 text-white rounded text-xs font-bold">+ Add Student</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${db.students.map(s => `
                            <div class="bg-white p-4 rounded-xl border">
                                <h3 class="font-bold text-slate-800">${s.name}</h3>
                                <p class="text-xs text-slate-500">Father: ${s.parentName} \vert{} Class:${s.class}</p>
                                <p class="text-xs text-slate-500">Mobile: ${s.parentMobile}</p>
                            </div>
                        `).join('')}
                    </div>`;
            } else if(mod === 'notices') {
                view.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-2xl font-bold">Notice Board</h2>
                        <button onclick="addNotice()" class="px-3 py-1.5 bg-blue-900 text-white rounded text-xs font-bold">+ New Notice</button>
                    </div>
                    <div class="space-y-3">
                        ${db.notices.map(n => `
                            <div class="bg-white p-4 rounded-xl border">
                                <h3 class="font-bold text-slate-800">${n.title}</h3>
                                <p class="text-sm text-slate-600 mt-1">${n.content}</p>
                                <span class="text-xs text-slate-400 mt-2 block">${n.date}</span>
                            </div>
                        `).join('')}
                    </div>`;
            } else if(mod === 'guardian') {
                const s = db.students[0];
                view.innerHTML = `
                    <div class="bg-blue-900 text-white p-6 rounded-xl mb-6">
                        <h2 class="text-2xl font-bold">${s.name}</h2>
                        <p class="text-xs text-blue-200">Class: ${s.class} | Scholar ID: ${s.id}</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                        <div class="bg-white p-4 rounded-xl border"><p class="text-xs text-slate-400">Total Fee</p><p class="text-xl font-bold">₹${s.totalFee}</p></div>
                        <div class="bg-white p-4 rounded-xl border"><p class="text-xs text-emerald-600">Paid Fee</p><p class="text-xl font-bold text-emerald-600">₹${s.paidFee}</p></div>
                        <div class="bg-white p-4 rounded-xl border"><p class="text-xs text-red-600">Previous Due</p><p class="text-xl font-bold text-red-600">₹${s.prevDue}</p></div>
                    </div>
                    <div class="bg-white p-4 rounded-xl border">
                        <h3 class="font-bold text-sm mb-1">Homework</h3>
                        <p class="text-sm text-slate-700 bg-slate-50 p-3 rounded">${s.homework}</p>
                    </div>`;
            }
        }

        function collectFee(id) {
            const db = getDBData();
            const s = db.students.find(x => x.id === id);
            const amt = prompt(`Enter Fee Amount collected for ${s.name}:`);
            if(amt) {
                s.paidFee = Number(s.paidFee) + Number(amt);
                saveDBData(db);
                loadModule('fees');
            }
        }

        function addNewStudent() {
            const name = prompt("Enter Student Name:");
            const cls = prompt("Enter Class:");
            if(name && cls) {
                const db = getDBData();
                db.students.push({ id: 'STU' + (100 + db.students.length + 1), name, parentName: 'Guardian', class: cls, parentMobile: '9829000000', totalFee: 20000, paidFee: 0, prevDue: 0, attendance: 100, result: 'N/A', homework: 'Welcome' });
                saveDBData(db);
                loadModule('students');
            }
        }

        function addNotice() {
            const title = prompt("Enter Notice Title:");
            const content = prompt("Enter Notice Content:");
            if(title && content) {
                const db = getDBData();
                db.notices.unshift({ id: Date.now(), title, content, date: new Date().toISOString().slice(0,10) });
                saveDBData(db);
                loadModule('notices');
            }
        }
    </script>
</body>
</html>
